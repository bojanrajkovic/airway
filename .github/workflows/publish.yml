# Publishes a release tag's image. Release Please creates the tag when its PR merges, on a commit
# CI has already tested on main. The image is built once without caches, so nothing an earlier run
# wrote reaches it, then tested, scanned, pushed, and attested as that same image.
name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # Pushes the image to ghcr.io.
      id-token: write # Signs the provenance with GitHub's OIDC identity.
      attestations: write # Stores the provenance with the repo's attestations.
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: airway:release
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          # Links the package to this repo, so it shows on the repo's page.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          no-cache: true
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:image
        env:
          AIRWAY_IMAGE: airway:release
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: airway:release
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker tag airway:release "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
