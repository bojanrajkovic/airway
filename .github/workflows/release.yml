# Keeps a release PR open from the Conventional Commits on main. Merging it tags v<version>, and the
# tag starts publish.yml, which publishes the image. Release PRs merge by hand, after the
# release-notes skill has written their notes.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-slim
    timeout-minutes: 5
    # Holds the releaser App's key, and deploys only from main.
    environment: release
    permissions: {}
    steps:
      # A tag or PR made with GITHUB_TOKEN doesn't start CI, and one made with an App's token does.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write # Release Please labels its PR.
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
