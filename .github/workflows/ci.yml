name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-26.04
    # Stops a stalled step from holding the runner for GitHub's 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only pushes to main write caches. A PR only restores main's caches, so a PR can't fill the
      # cache quota or leave anything for a later run to restore.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &pnpm-store-cache
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *pnpm-store-cache
      - run: pnpm install --frozen-lockfile
      # Fails if a package's registry signature doesn't verify.
      - run: pnpm audit signatures
      - run: pnpm check
      # If this step creates a migration, a schema change was committed without its migration.
      - name: Check the notes migrations are up to date
        run: |
          pnpm --filter @airway/contract migrations:generate
          git status --porcelain
          test -z "$(git status --porcelain)"

  db:
    name: Database tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # scripts/db.sh runs the same image and digest locally.
    services:
      postgres:
        image: postgres:19@sha256:4ea94de574c17f0372722806c949757050fbb1cd7648410fe45d6bba275cc00e
        env:
          POSTGRES_PASSWORD: airway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      AIRWAY_TEST_POSTGRES_URL: postgres://postgres:airway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # This step only restores the store. The Lint and test job saves it on main.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *pnpm-store-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

  browser:
    name: Browser tests
    runs-on: ubuntu-26.04
    # Playwright's image includes Chromium and the system packages that Chromium needs. The image's
    # tag must match the playwright package in the catalog, and
    # scripts/renovate/playwright-image.sh updates the tag when playwright updates. The container
    # runs as the runner's user, so the checkout and caches stay writable.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *pnpm-store-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:browser
      # Uploads the desktop and phone screenshots, in light and dark, to use in the PR.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: packages/web/tests/__screenshots__/
          if-no-files-found: ignore

  image:
    name: Image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Builds only amd64 until #77 adds arm64.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: airway:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
      # This job never pushes the image, so caching is safe.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: # zizmor: ignore[cache-poisoning]
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *pnpm-store-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:image
        env:
          AIRWAY_IMAGE: airway:ci
      - uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          image: airway:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

  zizmor:
    name: zizmor
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@a818f16177a5395fc11d3c73577caabaa7119391 # v0.9.1
        with:
          persona: auditor
          advanced-security: false
          annotations: true

  # The ruleset on main requires Check. GitHub counts a job as passing when it's skipped because a
  # job that it needs failed, so Check always runs and fails unless every job in `needs` succeeded.
  check:
    name: Check
    needs: [test, db, browser, image, zizmor]
    if: always()
    # This job runs one step that takes a few seconds, so the 1-vCPU runner is enough.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
