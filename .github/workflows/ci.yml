name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-26.04
    # Stops a stalled step from holding the runner for GitHub's 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches are written only by pushes to main. A PR restores main's caches and saves none, so
      # PRs can't fill the cache quota or leave anything for a later run to restore.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &pnpm-store-cache
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *pnpm-store-cache
      - run: pnpm install --frozen-lockfile
      # Fails if a package's registry signature doesn't verify.
      - run: pnpm audit signatures
      - run: pnpm check

  db:
    name: Database tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The same image and digest scripts/db.sh runs locally.
    services:
      postgres:
        image: postgres:18@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_PASSWORD: airway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      AIRWAY_TEST_POSTGRES_URL: postgres://postgres:airway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Only restores: the Lint and test job saves the store on main.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *pnpm-store-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

  browser:
    name: Browser tests
    runs-on: ubuntu-26.04
    # Playwright's image holds Chromium and its system packages. Its tag must match the playwright
    # package in the catalog. The user is the runner's, so the checkout and caches stay writable.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *pnpm-store-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:browser
      # Desktop and phone screenshots, in light and dark, for the PR's screenshots.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: packages/web/tests/__screenshots__/
          if-no-files-found: ignore

  image:
    name: Image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The cluster's nodes are amd64 only.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: airway:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
      # The image tests run in Vitest, so the job needs the repo's tools and packages too. No mise
      # cache: zizmor can't tell that this job publishes nothing, and the download is quick.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *pnpm-store-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:image
        env:
          AIRWAY_IMAGE: airway:ci
      # Fails on a high or critical finding that has a fix. One without a fix doesn't, because
      # nothing in airway could act on it.
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: airway:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

  # The ruleset on main requires Check. A job skipped after a failed job it needs counts as passing,
  # so this one always runs and fails unless every job it gates succeeded.
  check:
    name: Check
    needs: [test, db, browser, image]
    if: always()
    # One step of a few seconds, so the 1-vCPU runner is enough.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
