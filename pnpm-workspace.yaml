packages:
  - packages/*

# Every dependency's version lives here once, and package.json files say "catalog:". Strict mode
# makes `pnpm add` go through the catalog; a version typed into a package.json by hand isn't caught.
catalogMode: strict
catalog:
  "@babel/core": 8.1.0
  "@hono/node-server": 2.1.6
  "@hono/trpc-server": 0.4.2
  "@opentelemetry/api": 1.10.0
  "@opentelemetry/core": 3.1.0
  "@opentelemetry/instrumentation-http": 0.301.0
  "@opentelemetry/instrumentation-pg": 0.78.0
  "@opentelemetry/instrumentation-runtime-node": 0.38.0
  "@opentelemetry/instrumentation-undici": 0.35.0
  "@opentelemetry/resources": 3.1.0
  "@opentelemetry/sdk-metrics": 3.1.0
  "@opentelemetry/sdk-node": 0.301.0
  "@opentelemetry/sdk-trace": 3.1.0
  "@rolldown/plugin-babel": 0.3.1
  "@stylistic/eslint-plugin": 5.10.0
  "@trpc/server": 11.26.0
  # An alias, so a Node major bump changes only this line, not every tsconfig that extends it.
  "@tsconfig/node": npm:@tsconfig/node26@26.0.1
  "@tsconfig/strictest": 2.0.8
  "@types/node": 26.6.6
  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  "@vitest/browser-playwright": 5.1.0
  babel-plugin-react-compiler: 1.0.0
  drizzle-orm: 0.45.4
  fast-check: 4.10.2
  hono: 4.13.17
  jose: 6.2.17
  libpg-query: 18.2.2
  neverthrow: 8.2.0
  oxfmt: 0.77.0
  oxlint: 1.92.0
  oxlint-plugin-eslint: 1.92.0
  oxlint-tsgolint: 7.0.2006
  pg: 8.23.1
  pino: 10.4.0
  pino-pretty: 13.2.0
  playwright: 1.65.0
  react: 19.3.1
  react-dom: 19.3.1
  rolldown: 1.3.1
  superjson: 2.2.6
  temporal-polyfill: 1.0.8
  testcontainers: 12.2.1
  typescript: 7.0.2
  vite: 8.3.7
  vitest: 5.1.0
  vitest-browser-react: 2.3.0
  zod: 4.6.7

# Setting this turns on strict mode: a version younger than a day fails the install instead of
# being skipped silently. Most malicious releases are caught and pulled within that day.
minimumReleaseAge: 1440
# Fails on a version published with weaker trust evidence (provenance, trusted publishing) than an
# earlier version of the same package, the usual sign of a stolen publish token.
trustPolicy: no-downgrade

# `pnpm add` writes exact versions, so the lockfile and the catalog say the same thing.
savePrefix: ""

# tRPC lists TypeScript as a peer only for its types. Marked optional, it stays out of the image's
# production dependencies; the root's devDependency still satisfies it for type-checking.
packageExtensions:
  "@trpc/server":
    peerDependenciesMeta:
      typescript:
        optional: true

permissions:
  # Its postinstall only checks versions; the library works without it.
  protobufjs:
    build: false
  # testcontainers' Docker client pulls these in for SSH connections, which the tests never use.
  # Both fall back to plain JavaScript without their native builds.
  cpu-features:
    build: false
  ssh2:
    build: false
