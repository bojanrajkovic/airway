packages:
  - packages/*

# Every dependency's version lives here once, and package.json files say "catalog:". Strict mode
# makes `pnpm add` go through the catalog. pnpm still accepts a version typed into a package.json
# by hand.
catalogMode: strict
catalog:
  "@babel/core": 8.1.3
  "@hono/node-server": 2.1.11
  "@hono/trpc-server": 0.4.2
  "@opentelemetry/api": 1.10.0
  "@opentelemetry/core": 3.1.1
  "@opentelemetry/instrumentation-http": 0.301.2
  "@opentelemetry/instrumentation-pg": 0.78.0
  "@opentelemetry/instrumentation-runtime-node": 0.38.0
  "@opentelemetry/instrumentation-undici": 0.35.1
  "@opentelemetry/resources": 3.1.1
  "@opentelemetry/sdk-metrics": 3.1.1
  "@opentelemetry/sdk-node": 0.301.2
  "@opentelemetry/sdk-trace": 3.1.1
  "@rolldown/plugin-babel": 0.3.1
  "@stylistic/eslint-plugin": 6.0.1
  "@trpc/server": 11.29.11
  # Every tsconfig extends this alias, so a Node major bump changes only this line.
  "@tsconfig/node": npm:@tsconfig/node26@26.0.2
  "@tsconfig/strictest": 2.0.9
  "@types/d3-random": 3.0.4
  "@types/node": 26.6.6
  "@types/pg": 8.23.1
  "@types/pg-copy-streams": 1.2.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  "@vitest/browser-playwright": 5.1.1
  babel-plugin-react-compiler: 1.0.0
  crc: 4.3.2
  d3-random: 3.0.2
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  drizzle-zod: 0.8.3
  fast-check: 4.11.0
  hono: 4.13.21
  jose: 6.2.18
  libpg-query: 18.2.5
  neverthrow: 8.2.0
  oxfmt: 0.79.0
  oxlint: 1.95.0
  oxlint-plugin-eslint: 1.95.0
  oxlint-tsgolint: 7.0.2008
  pg: 8.23.1
  pg-copy-streams: 7.0.0
  pino: 10.4.0
  pino-pretty: 13.2.0
  playwright: 1.65.1
  react: 19.3.1
  react-dom: 19.3.1
  rolldown: 1.3.3
  superjson: 2.2.7
  temporal-polyfill: 1.0.8
  testcontainers: 12.2.2
  typescript: 7.0.2
  vite: 8.3.8
  vitest: 5.1.1
  vitest-browser-react: 2.3.0
  zod: 4.6.7

# Setting this turns on strict mode, in which pnpm fails the install on a version younger than a
# day instead of silently skipping that version. Most malicious releases are caught and pulled within that day.
minimumReleaseAge: 1440
# pnpm fails the install when a version has weaker trust evidence (provenance, trusted publishing)
# than an earlier version of the same package. Weaker evidence usually means a stolen publish token.
trustPolicy: no-downgrade

# `pnpm add` writes exact versions, so the lockfile and the catalog say the same thing.
savePrefix: ""

# tRPC lists TypeScript as a peer dependency only for TypeScript's types. Marking the peer optional
# keeps TypeScript out of the image's production dependencies, and the root's devDependency still
# satisfies the peer for type-checking.
packageExtensions:
  "@trpc/server":
    peerDependenciesMeta:
      typescript:
        optional: true

permissions:
  # The protobufjs postinstall only checks versions, and the library works without that script.
  protobufjs:
    build: false
  # testcontainers' Docker client depends on cpu-features and ssh2 for SSH connections, which the
  # tests never use. Both packages run as plain JavaScript when their native builds are missing.
  cpu-features:
    build: false
  ssh2:
    build: false
  # esbuild is drizzle-kit's bundler. The esbuild postinstall only checks the platform binary, and
  # pnpm installs that binary as an optional dependency. drizzle-kit runs without the postinstall.
  esbuild:
    build: false
